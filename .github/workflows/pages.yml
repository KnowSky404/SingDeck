name: Release and deploy GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Stable vX.Y.Z on main to redeploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      publish-pages: true
      release-version: ${{ github.event.release.tag_name || inputs.version }}

  deploy:
    needs: validate
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  release-assets:
    needs: validate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Attach static dashboard archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          tar --no-same-owner -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist
          cd dist
          test -f index.html
          test -d assets
          zip -qr "$RUNNER_TEMP/singdeck-${RELEASE_TAG}.zip" .
          cd "$RUNNER_TEMP"
          cp "singdeck-${RELEASE_TAG}.zip" singdeck.zip
          sha256sum "singdeck-${RELEASE_TAG}.zip" singdeck.zip > SHA256SUMS
          gh release upload "$RELEASE_TAG" "singdeck-${RELEASE_TAG}.zip" singdeck.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
