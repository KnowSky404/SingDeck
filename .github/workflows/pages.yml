name: Release and deploy GitHub Pages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      publish-pages: true

  deploy:
    needs: validate
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4

  release-assets:
    needs: validate
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages
      - name: Attach static dashboard archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir dist
          tar --no-same-owner -xf "$RUNNER_TEMP/pages/artifact.tar" -C dist
          cd dist
          test -f index.html
          test -d assets
          zip -qr "$RUNNER_TEMP/singdeck-${RELEASE_TAG}.zip" .
          cd "$RUNNER_TEMP"
          cp "singdeck-${RELEASE_TAG}.zip" singdeck.zip
          sha256sum "singdeck-${RELEASE_TAG}.zip" singdeck.zip > SHA256SUMS
          gh release upload "$RELEASE_TAG" "singdeck-${RELEASE_TAG}.zip" singdeck.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
