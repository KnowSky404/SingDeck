name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      publish-pages:
        type: boolean
        default: false
      release-version:
        type: string
        default: ""

concurrency:
  group: singdeck-ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && (github.event.action != 'edited' || github.event.changes.base.ref.from) && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && (github.event.action != 'edited' || github.event.changes.base.ref.from) }}

permissions:
  contents: read
jobs:
  check:
    name: ${{ github.event.action == 'edited' && !github.event.changes.base.ref.from && 'PR metadata only' || 'check' }}
    if: github.event.action != 'edited' || github.event.changes.base.ref.from
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check source and determine coverage
        id: coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          scope=full
          tested_commit=$(git rev-list --parents -n 1 HEAD)
          if [[ "$GITHUB_EVENT_NAME" == pull_request &&
                "$tested_commit" == "$GITHUB_SHA $BASE_SHA $PR_HEAD_SHA" ]]; then
            git diff --check "$BASE_SHA" HEAD
            classifier="$RUNNER_TEMP/singdeck-ci-scope.sh"
            if git show "$BASE_SHA:scripts/ci-scope.sh" > "$classifier" 2>/dev/null &&
               result=$(bash "$classifier" "$BASE_SHA" "$GITHUB_SHA") &&
               [[ "$result" == docs ]]; then
              scope=docs
            fi
          else
            git show --check --format= HEAD
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          {
            echo "### Verification scope: $scope"
            echo
            printf -- '- Checked-out commit and its parents: `%s`\n' "$tested_commit"
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              printf -- '- Event base and head: `%s %s`\n' "$BASE_SHA" "$PR_HEAD_SHA"
              if [[ "$tested_commit" != "$GITHUB_SHA $BASE_SHA $PR_HEAD_SHA" ]]; then
                echo '- Event and tested parents differ. This result cannot confirm the event pair.'
              fi
            fi
            if [[ "$scope" == docs ]]; then
              echo "- Allowlisted documentation: diff and production build."
            else
              echo "- Full: generated inputs, lint, units, build, mock browsers, and official-core integration."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Verify release source
        if: inputs.publish-pages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          RELEASE_IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin \
            '+refs/heads/main:refs/singdeck/verified-main'
          git merge-base --is-ancestor "$GITHUB_SHA" refs/singdeck/verified-main
          case "$GITHUB_EVENT_NAME" in
            release)
              test "$GITHUB_REF" = "refs/tags/$RELEASE_VERSION"
              [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
              if [[ "$RELEASE_VERSION" == *-* ]]; then
                test "$RELEASE_IS_PRERELEASE" = true
              else
                test "$RELEASE_IS_PRERELEASE" = false
              fi
              ;;
            workflow_dispatch)
              test "$GITHUB_REF" = refs/heads/main
              [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
              test "$(git rev-parse --verify "refs/tags/$RELEASE_VERSION^{commit}")" = "$GITHUB_SHA"
              test "$(gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false')" = true
              ;;
            *) exit 1 ;;
          esac
          bun -e 'if (process.env.RELEASE_VERSION !== `v${require("./package.json").version}`) throw new Error("Expected release version must match package.json");'
      - run: bun install --frozen-lockfile
      - name: Verify classifier and generated inputs
        if: steps.coverage.outputs.scope != 'docs'
        run: |
          bash scripts/test-ci-scope.sh
          bun run proto:generate
          bun run licenses:generate
          git diff --exit-code -- src/proto public/third-party-licenses.txt
      - run: bun run lint
        if: steps.coverage.outputs.scope != 'docs'
      - run: bun run test
        if: steps.coverage.outputs.scope != 'docs'
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
        if: steps.coverage.outputs.scope != 'docs'
      - name: Browser workspace regressions
        if: steps.coverage.outputs.scope != 'docs'
        run: bun run test:e2e -- 'e2e/(?!native\.spec\.ts$)' --trace off
      - name: Obtain pinned official integration fixture
        if: steps.coverage.outputs.scope != 'docs'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download v1.14.0 --repo SagerNet/sing-box --pattern sing-box-1.14.0-linux-amd64.tar.gz
          echo '2375de6999f4f56ab46b4fc5ddf26a6aba1d3e61a0f4e7ddec2f4690457d5f63  sing-box-1.14.0-linux-amd64.tar.gz' | sha256sum -c -
          tar --no-same-owner -xzf sing-box-1.14.0-linux-amd64.tar.gz
          test -x "$RUNNER_TEMP/sing-box-1.14.0-linux-amd64/sing-box"
          echo "SING_BOX_BINARY=$RUNNER_TEMP/sing-box-1.14.0-linux-amd64/sing-box" >> "$GITHUB_ENV"
      - run: bun run test:integration
        if: steps.coverage.outputs.scope != 'docs'
      - name: Official native browser transport and diagnostics
        if: steps.coverage.outputs.scope != 'docs'
        run: bun run test:e2e -- 'e2e/native\.spec\.ts$' --project desktop --workers 1 --trace off
      - name: Upload verified Pages build
        if: inputs.publish-pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
